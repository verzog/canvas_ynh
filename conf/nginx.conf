location / {
    # Serve Canvas static/compiled assets directly, fall back to the app server.
    root __INSTALL_DIR__/public;
    try_files $uri @canvas;

    # Compress text assets. Canvas ships several MB of JS/CSS per page; without
    # this nginx serves them uncompressed, which inflates outbound traffic.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/wasm image/svg+xml font/ttf font/woff font/woff2;

    # Include SSOwat / YunoHost integration.
    include conf.d/yunohost_panel.conf.inc;
}

# Canvas fingerprints its compiled assets (content hash in the filename) under
# /dist/, so they are safe to cache indefinitely. This is the biggest lever on
# repeat outbound traffic: a returning browser reuses its cached bundles instead
# of re-downloading them on every visit.
location ^~ /dist/ {
    root __INSTALL_DIR__/public;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json
               image/svg+xml application/wasm font/ttf font/woff font/woff2;

    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;

    try_files $uri @canvas;
}

location @canvas {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Course exports and file uploads can be large.
    client_max_body_size 100M;
    proxy_read_timeout 300s;
}
